[project]
name = "pfm-assignment"
version = "0.1.0"
description = "PFM assignment — data ingestion, warehouse, attribution"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "polars[excel]>=1.0",
    "duckdb>=1.0",
    "openpyxl>=3.1",
    "fastexcel>=0.10",
    "pyarrow>=16.0",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "nbformat>=5.0",
]
consumer = [
    "streamlit>=1.59",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*", "warehouse*"]
