name: Temporary join hypothesis probe

on:
  push:
    branches:
      - tmp/join-hypothesis-probe

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Run join matrix
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from collections import Counter, defaultdict
          from datetime import datetime, date

          path = 'data/source.xlsx'
          wb = load_workbook(path, read_only=True, data_only=True)
          print('SHEETS', wb.sheetnames)

          def read_sheet(name):
              ws = wb[name]
              rows = list(ws.iter_rows(values_only=True))
              headers = [str(x).strip() if x is not None else None for x in rows[0]]
              out = []
              for row in rows[1:]:
                  if all(v is None for v in row):
                      continue
                  out.append(dict(zip(headers, row)))
              return out

          tn = read_sheet('Sample TrackNow Checkouts')
          ph = read_sheet('Sample PostHog Sessions')
          print('ROWS', {'tracknow': len(tn), 'posthog': len(ph)})
          print('TN_COLS', list(tn[0].keys()))
          print('PH_COLS', list(ph[0].keys()))

          def norm(v):
              if v is None:
                  return None
              s = str(v).strip()
              return s if s else None

          def norm_lower(v):
              s = norm(v)
              return s.lower() if s is not None else None

          tn_ids = ['click_id', 'affiliate_session_id', 'tracknow_user_id']
          ph_ids = ['session_id', 'posthog_distinct_id', 'click_id_from_url', 'gclid', 'fbclid']

          print('\n=== COVERAGE ===')
          for c in tn_ids:
              vals = [norm(r.get(c)) for r in tn]
              print('TN', c, 'present=', sum(v is not None for v in vals), 'unique=', len(set(v for v in vals if v is not None)))
          for c in ph_ids:
              vals = [norm(r.get(c)) for r in ph]
              print('PH', c, 'present=', sum(v is not None for v in vals), 'unique=', len(set(v for v in vals if v is not None)))

          print('\n=== EXACT JOIN MATRIX (all identifier cross-products) ===')
          results = []
          for tc in tn_ids:
              for pc in ph_ids:
                  ph_index = defaultdict(list)
                  for j, r in enumerate(ph):
                      v = norm(r.get(pc))
                      if v is not None:
                          ph_index[v].append(j)
                  matched_tn = set()
                  matched_ph = set()
                  pairs = []
                  for i, r in enumerate(tn):
                      v = norm(r.get(tc))
                      if v is None:
                          continue
                      for j in ph_index.get(v, []):
                          matched_tn.add(i); matched_ph.add(j); pairs.append((i,j))
                  fanout_tn = Counter(i for i,j in pairs)
                  fanout_ph = Counter(j for i,j in pairs)
                  res = {
                      'tn_col': tc, 'ph_col': pc,
                      'pairs': len(pairs),
                      'matched_tn': len(matched_tn),
                      'coverage_pct': round(len(matched_tn)/len(tn)*100, 1),
                      'matched_ph': len(matched_ph),
                      'tn_multi_ph': sum(n > 1 for n in fanout_tn.values()),
                      'ph_multi_tn': sum(n > 1 for n in fanout_ph.values()),
                  }
                  results.append(res)
                  print(res)

          print('\n=== CASE-INSENSITIVE / TRIMMED JOIN MATRIX ===')
          for tc in tn_ids:
              for pc in ph_ids:
                  ph_index = defaultdict(list)
                  for j, r in enumerate(ph):
                      v = norm_lower(r.get(pc))
                      if v is not None:
                          ph_index[v].append(j)
                  matched_tn = set()
                  pairs = 0
                  for i, r in enumerate(tn):
                      v = norm_lower(r.get(tc))
                      if v is None:
                          continue
                      js = ph_index.get(v, [])
                      if js:
                          matched_tn.add(i); pairs += len(js)
                  if matched_tn:
                      print({'tn_col': tc, 'ph_col': pc, 'pairs': pairs, 'matched_tn': len(matched_tn), 'coverage_pct': round(len(matched_tn)/len(tn)*100,1)})

          def to_date(v):
              if v is None: return None
              if isinstance(v, datetime): return v.date()
              if isinstance(v, date): return v
              s = str(v).strip()
              for fmt in ('%Y-%m-%d', '%d/%m/%Y', '%m/%d/%Y'):
                  try: return datetime.strptime(s, fmt).date()
                  except ValueError: pass
              return None

          tn_dates = Counter(to_date(r.get('created_date')) for r in tn if to_date(r.get('created_date')))
          conv_sessions = [r for r in ph if bool(r.get('has_tracknow_conversion'))]
          checkout_sessions = [r for r in ph if bool(r.get('has_checkout_started'))]
          ph_conv_dates = Counter(to_date(r.get('session_date')) for r in conv_sessions if to_date(r.get('session_date')))
          ph_checkout_dates = Counter(to_date(r.get('session_date')) for r in checkout_sessions if to_date(r.get('session_date')))

          print('\n=== EVENT FLAG COUNTS ===')
          print('has_tracknow_conversion sessions=', len(conv_sessions))
          print('has_checkout_started sessions=', len(checkout_sessions))
          print('conversion-session dates=', len(ph_conv_dates), 'checkout-session dates=', len(ph_checkout_dates))

          common_conv_dates = sorted(set(tn_dates) & set(ph_conv_dates))
          common_checkout_dates = sorted(set(tn_dates) & set(ph_checkout_dates))
          print('\n=== DATE-LEVEL OVERLAP ===')
          print('TrackNow conversion dates=', len(tn_dates))
          print('common dates with has_tracknow_conversion=', len(common_conv_dates))
          print('TrackNow orders on those dates=', sum(tn_dates[d] for d in common_conv_dates))
          print('PostHog conversion sessions on those dates=', sum(ph_conv_dates[d] for d in common_conv_dates))
          print('dates where daily counts exactly equal=', sum(tn_dates[d] == ph_conv_dates[d] for d in common_conv_dates))
          print('common dates with has_checkout_started=', len(common_checkout_dates))
          print('TrackNow orders on those dates=', sum(tn_dates[d] for d in common_checkout_dates))
          print('PostHog checkout sessions on those dates=', sum(ph_checkout_dates[d] for d in common_checkout_dates))

          print('\n=== SAME-DATE CANDIDATE AMBIGUITY ===')
          for flag, rows in [('has_tracknow_conversion', conv_sessions), ('has_checkout_started', checkout_sessions)]:
              idx = defaultdict(list)
              for j, r in enumerate(rows):
                  d = to_date(r.get('session_date'))
                  if d: idx[d].append(j)
              counts = []
              for i, r in enumerate(tn):
                  d = to_date(r.get('created_date'))
                  counts.append(len(idx.get(d, [])))
              print(flag, {
                  'orders_with_0_candidates': sum(c==0 for c in counts),
                  'orders_with_1_candidate': sum(c==1 for c in counts),
                  'orders_with_gt1_candidates': sum(c>1 for c in counts),
              })

          print('\n=== PRIMARY QUESTION ===')
          key = next(r for r in results if r['tn_col']=='affiliate_session_id' and r['ph_col']=='session_id')
          print('affiliate_session_id -> session_id', key)
          key2 = next(r for r in results if r['tn_col']=='tracknow_user_id' and r['ph_col']=='posthog_distinct_id')
          print('tracknow_user_id -> posthog_distinct_id', key2)
          PY
