version: 2

sources:
  - name: raw
    description: Raw tables loaded from data/source.xlsx by ingestion/load_excel.py.
    schema: raw
    tables:
      - name: tracknow_checkouts
        description: TrackNow checkout orders at the ingestion grain.
        columns:
          - name: tracknow_order_id
            description: Source TrackNow order identifier.
          - name: created_date
            description: Source conversion creation date.
          - name: click_id
            description: Affiliate click identifier, when present.
      - name: posthog_sessions
        description: PostHog web sessions at the ingestion grain.
        columns:
          - name: session_id
            description: Source PostHog session identifier.
          - name: session_date
            description: Calendar date of the session.
          - name: gclid
            description: Google click identifier, when present.
          - name: fbclid
            description: Meta click identifier, when present.
          - name: click_id_from_url
            description: Click identifier extracted from the landing URL, when present.
